<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'">
<title>ProTimer — Backstage</title>
<style>
  :root{ --bg:#0a0c10; --panel:#12151b; --panel2:#171b22; --border:#222934;
    --text:#e8edf3; --dim:#8b97a5; --dim2:#5a6573; --accent:#3fb950;
    --amber:#e3b341; --red:#f0564d; --blue:#4493f8; }
  *{box-sizing:border-box; margin:0;}
  body{background:var(--bg); color:var(--text); height:100vh; overflow:hidden;
    font-family:-apple-system,"Helvetica Neue",system-ui,sans-serif; display:flex; flex-direction:column; padding:2.2vh 2.2vw;}
  .top{display:flex; align-items:baseline; gap:14px; margin-bottom:2vh; flex:0 0 auto;}
  .top .title{font-size:3.2vh; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .top .title b{color:var(--accent);}
  .top .grow{flex:1;}
  .top .now-lbl{font-size:1.5vh; letter-spacing:.15em; color:var(--dim2); text-transform:uppercase;}
  .top .clock{font-variant-numeric:tabular-nums; font-size:4.4vh; font-weight:700; font-family:"SF Mono",ui-monospace,Menlo,monospace;}
  .top .clock .s{font-size:2.6vh; color:var(--dim);}

  .main{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:2vw; min-height:0;}
  @media(max-width:760px){ .main{grid-template-columns:1fr; overflow-y:auto;} }

  .left{display:flex; flex-direction:column; gap:1.6vh; min-height:0;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:2.4vh 2vw;}
  .now{flex:1; display:flex; flex-direction:column; justify-content:center; border-left:5px solid var(--accent);}
  .tag{font-size:1.6vh; letter-spacing:.18em; color:var(--dim2); text-transform:uppercase; font-weight:700; margin-bottom:1vh;}
  .now .name{font-size:5vh; font-weight:800; line-height:1.05; margin-bottom:1.4vh; word-break:break-word;}
  .now .note{color:var(--dim); font-size:2.1vh; margin-bottom:1.8vh;}
  .now .timer{font-family:"SF Mono",ui-monospace,Menlo,monospace; font-weight:700; font-variant-numeric:tabular-nums;
    font-size:8vh; line-height:1;}
  .now .meta{display:flex; gap:2.5vw; margin-top:1.4vh; color:var(--dim); font-size:1.9vh;}
  .now .meta b{color:var(--text); font-family:"SF Mono",Menlo,monospace; font-weight:600;}
  .next{border-left:5px solid var(--blue); flex:0 0 auto;}
  .next .name{font-size:3.2vh; font-weight:700;}
  .next .note{color:var(--dim); font-size:1.8vh; margin-top:.6vh;}
  .next .at{color:var(--blue); font-family:"SF Mono",Menlo,monospace; font-size:2vh; margin-top:.6vh;}

  .right{display:flex; flex-direction:column; min-height:0;}
  .right .tag{margin-bottom:1.4vh;}
  .sched{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:.7vh;}
  .sched::-webkit-scrollbar{width:8px;} .sched::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  .ev{display:flex; align-items:center; gap:1.2vw; padding:1.3vh 1.2vw; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; position:relative; overflow:hidden;}
  .ev .stripe{position:absolute; left:0; top:0; bottom:0; width:4px;}
  .ev.current{border-color:var(--accent); background:#10231a;}
  .ev.past{opacity:.4;}
  .ev .time{font-family:"SF Mono",Menlo,monospace; font-size:2vh; color:var(--dim); flex:0 0 auto; min-width:11ch;}
  .ev .nm{flex:1; font-size:2.2vh; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ev .nt{color:var(--dim2); font-size:1.6vh; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:40%;}
  .ev .dur{font-family:"SF Mono",Menlo,monospace; font-size:1.7vh; color:var(--dim2); flex:0 0 auto;}
  .empty{color:var(--dim2); text-align:center; padding:4vh; font-size:2vh;}

  .foot{flex:0 0 auto; display:flex; align-items:center; gap:2.5vw; margin-top:1.8vh; padding-top:1.6vh;
    border-top:1px solid var(--border); font-size:2vh; color:var(--dim); flex-wrap:wrap;}
  .foot b{color:var(--text); font-family:"SF Mono",Menlo,monospace;}
  .ou{font-family:"SF Mono",Menlo,monospace; font-weight:700; padding:.5vh 1.4vh; border-radius:8px;
    background:var(--panel2); border:1px solid var(--border); color:var(--dim);}
  .ou.late{background:#3a1f1d; border-color:#5a2b28; color:#ff8b84;}
  .ou.early{background:#16263a; border-color:#1f3a5a; color:#7db8ff;}
  .ou.ontime{background:#10231a; border-color:#1f4a30; color:var(--accent);}
  .conn{position:fixed; top:1vh; right:1.4vw; font-size:1.4vh; color:var(--dim2); display:flex; align-items:center; gap:6px;}
  .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--red);} .conn .dot.on{background:var(--accent);}
</style>
</head>
<body>
  <div class="conn"><span class="dot" id="dot"></span><span id="connTxt"></span></div>
  <div class="top">
    <div class="title" id="title">PRO<b>TIMER</b></div>
    <div class="grow"></div>
    <div style="text-align:right">
      <div class="now-lbl" id="lblNow">TIME NOW</div>
      <div class="clock" id="clock">--:--<span class="s">:--</span></div>
    </div>
  </div>

  <div class="main">
    <div class="left">
      <div class="card now">
        <div class="tag" id="lblNowTag">NOW</div>
        <div class="name" id="nowName">—</div>
        <div class="note" id="nowNote"></div>
        <div class="timer" id="nowTimer"></div>
        <div class="meta" id="nowMeta"></div>
      </div>
      <div class="card next">
        <div class="tag" id="lblNextTag">NEXT</div>
        <div class="name" id="nextName">—</div>
        <div class="note" id="nextNote"></div>
        <div class="at" id="nextAt"></div>
      </div>
    </div>

    <div class="right">
      <div class="tag" id="lblSched">SCHEDULE</div>
      <div class="sched" id="sched"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
function pad(n){ return String(n).padStart(2,'0'); }
function clk(ms){ const d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtSecs(s,neg){ const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;
  return (neg?'−':'')+(h>0?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`); }
function fmtMs(ms){ return ms>=0?fmtSecs(Math.ceil(ms/1000),false):fmtSecs(Math.floor(-ms/1000),true); }

const T = {
  sr:{ now:'SADA', next:'SLEDI', sched:'RASPORED', timeNow:'TRENUTNO VREME', plannedEnd:'Planiran kraj',
    projected:'Procena kraja', behind:'kasni', ahead:'ispred', onTime:'NA VREME', started:'Počelo', ends:'Kraj',
    empty:'Nema tačaka u rundownu', conn:'uživo', lost:'veza pala…', noNext:'— kraj rundowna —' },
  en:{ now:'NOW', next:'NEXT', sched:'SCHEDULE', timeNow:'TIME NOW', plannedEnd:'Planned end',
    projected:'Projected end', behind:'behind', ahead:'ahead', onTime:'ON TIME', started:'Started', ends:'Ends',
    empty:'No items in the rundown', conn:'live', lost:'connection lost…', noNext:'— end of rundown —' }
};
let lang='sr';
const tr = k => (T[lang]&&T[lang][k])||T.sr[k]||k;
const setText=(el,value)=>{ value=String(value); if(el.textContent!==value) el.textContent=value; };
const setHTML=(el,value)=>{ if(el.innerHTML!==value) el.innerHTML=value; };

let S=null, plan=null, staticDirty=true, stateSignature='', planDay='', lastScrollCue=null, lastStateVersion=-1, lastServerInstance=null;
let clockOffsetMs=0, clockSynced=false, clockSyncing=false;
const hostNow=()=>Date.now()+clockOffsetMs;

async function syncClock(samples=3){
  if(clockSyncing) return;
  clockSyncing=true;
  let best=null;
  try{
    for(let i=0;i<samples;i++){
      const started=Date.now();
      const aborter=new AbortController();
      const timeout=setTimeout(()=>aborter.abort(),location.protocol==='https:'?7000:3000);
      let data;
      try{
        const response=await fetch('/time',{cache:'no-store',signal:aborter.signal});
        if(!response.ok) throw new Error('time '+response.status);
        data=await response.json();
      }finally{ clearTimeout(timeout); }
      const received=Date.now(), rtt=received-started;
      if(Number.isFinite(data.now)&&(!best||rtt<best.rtt)) best={rtt,offset:data.now-(started+received)/2};
    }
    if(best){ clockOffsetMs=best.offset; clockSynced=true; }
  }catch(_){}
  clockSyncing=false;
}

function applyState(next){
  if(!next||typeof next!=='object') return false;
  if(typeof next._instance==='string'&&next._instance!==lastServerInstance){
    lastServerInstance=next._instance;
    lastStateVersion=-1;
  }
  const version=Number(next._version);
  if(Number.isFinite(version)){
    if(version<=lastStateVersion) return false;
    lastStateVersion=version;
  }
  if(!clockSynced&&Number.isFinite(next._serverNow)) clockOffsetMs=next._serverNow-Date.now();
  const signature=JSON.stringify([next.lang,next.text,next.showStart,next.currentCue,next.cues||[]]);
  if(signature!==stateSignature){ stateSignature=signature; staticDirty=true; }
  S=next;
  if(S.lang&&S.lang!==lang){ lang=S.lang; applyStaticLabels(); staticDirty=true; }
  return true;
}

let lastPollSuccess=0, pollController=null;
const markLive=()=>{ $('dot').classList.add('on'); setText($('connTxt'),tr('conn')); };
const markLost=()=>{
  if(location.protocol==='https:'&&Date.now()-lastPollSuccess<25000) return;
  $('dot').classList.remove('on'); setText($('connTxt'),tr('lost'));
};
function connect(){
  const es=new EventSource('/events');
  es.onopen=()=>{ markLive(); syncClock(1); };
  es.onmessage=e=>{ try{ applyState(JSON.parse(e.data)); }catch(_){} };
  es.onerror=()=>{ markLost(); es.close(); setTimeout(connect,1000); };
}
async function pollLoop(){
  let failures=0;
  while(true){
    const aborter=new AbortController();
    pollController=aborter;
    const timeout=setTimeout(()=>aborter.abort(),30000);
    try{
      const response=await fetch('/poll?since='+encodeURIComponent(lastStateVersion)+'&r='+Date.now(),{cache:'no-store',signal:aborter.signal});
      if(!response.ok) throw new Error('poll '+response.status);
      const payload=await response.json();
      if(payload.state) applyState(payload.state);
      if(Number.isFinite(payload.version)&&payload.version>lastStateVersion) lastStateVersion=payload.version;
      failures=0;
      lastPollSuccess=Date.now(); markLive();
    }catch(_){
      markLost();
      failures=Math.min(failures+1,5);
      await new Promise(resolve=>setTimeout(resolve,Math.min(5000,500*(2**(failures-1)))+Math.random()*250));
    }finally{ clearTimeout(timeout); if(pollController===aborter) pollController=null; }
  }
}
if(location.protocol==='https:') pollLoop(); else connect();
syncClock(location.protocol==='https:'?1:3);
setInterval(()=>syncClock(1),30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ if(pollController)pollController.abort(); syncClock(); } });
window.addEventListener('online',()=>{ if(pollController)pollController.abort(); syncClock(); });

function applyStaticLabels(){
  document.documentElement.lang=lang;
  setText($('lblNow'),tr('timeNow')); setText($('lblNowTag'),tr('now'));
  setText($('lblNextTag'),tr('next')); setText($('lblSched'),tr('sched'));
  if($('dot').classList.contains('on')) setText($('connTxt'),tr('conn'));
}
applyStaticLabels();

function todayAt(hhmm, now){ if(!hhmm) return null; const [h,m]=hhmm.split(':').map(Number);
  if(isNaN(h)||isNaN(m)) return null; const d=new Date(now); d.setHours(h,m,0,0); return d.getTime(); }
function dayKey(now){ const d=new Date(now); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function buildPlan(state,now){
  const source=state.cues||[], anchor=todayAt(state.showStart,now); let acc=anchor;
  const rows=source.map((c,i)=>{ const start=acc, end=acc==null?null:acc+c.durationMs; acc=end;
    return {name:c.name,durationMs:c.durationMs,note:c.note||'',color:c.color||'',plannedStart:start,plannedEnd:end,index:i}; });
  const ci=state.currentCue!=null?state.currentCue:-1;
  const total=source.reduce((sum,c)=>sum+c.durationMs,0);
  return {rows,ci,cur:ci>=0?rows[ci]:null,nxt:ci>=0?rows[ci+1]:(rows[0]||null),
    plannedEnd:anchor==null?null:anchor+total,
    sumAfter:ci>=0?source.slice(ci+1).reduce((sum,c)=>sum+c.durationMs,0):0};
}

function renderStatic(now){
  plan=buildPlan(S,now); planDay=dayKey(now); staticDirty=false;
  const {rows,ci,cur,nxt}=plan;

  if(S.text) setText($('title'),S.text);
  else setHTML($('title'),'PRO<b>TIMER</b>');
  setText($('nowName'),cur?cur.name:'—');
  setText($('nowNote'),cur&&cur.note?cur.note:'');
  setHTML($('nowMeta'),cur&&cur.plannedStart!=null
    ? `${tr('started')} <b>${clk(cur.plannedStart)}</b> · ${tr('ends')} <b>${clk(cur.plannedEnd)}</b>`:'');

  if(nxt&&nxt!==cur){
    setText($('nextName'),nxt.name); setText($('nextNote'),nxt.note||'');
    setText($('nextAt'),nxt.plannedStart!=null?clk(nxt.plannedStart):'');
  } else { setText($('nextName'),tr('noNext')); setText($('nextNote'),''); setText($('nextAt'),''); }

  const se=$('sched');
  if(!rows.length) setHTML(se,`<div class="empty">${tr('empty')}</div>`);
  else {
    se.innerHTML=rows.map((c,i)=>{
      const cls=i===ci?'current':(ci>=0&&i<ci?'past':'');
      const time=c.plannedStart!=null?`${clk(c.plannedStart)}–${clk(c.plannedEnd)}`:fmtMs(c.durationMs);
      const stripe=c.color?`<span class="stripe" style="background:${c.color}"></span>`:'';
      const note=c.note?'<span class="nt"></span>':'';
      const dur=c.plannedStart!=null?`<span class="dur">${fmtMs(c.durationMs)}</span>`:'';
      return `<div class="ev ${cls}" data-i="${i}">${stripe}<span class="time">${time}</span><span class="nm"></span>${note}${dur}</div>`;
    }).join('');
    se.querySelectorAll('.ev').forEach(ev=>{ const c=rows[+ev.dataset.i];
      setText(ev.querySelector('.nm'),c.name||'—'); const nt=ev.querySelector('.nt'); if(nt)setText(nt,c.note); });
    const curEl=se.querySelector('.ev.current');
    if(curEl&&lastScrollCue!==ci){ curEl.scrollIntoView({block:'nearest'}); lastScrollCue=ci; }
  }
  if(ci<0) lastScrollCue=-1;
}

function renderTick(){
  const now=hostNow(), d=new Date(now);
  setHTML($('clock'),`${pad(d.getHours())}:${pad(d.getMinutes())}<span class="s">:${pad(d.getSeconds())}</span>`);
  if(!S) return;
  if(dayKey(now)!==planDay) staticDirty=true;
  if(staticDirty||!plan) renderStatic(now);

  const cur=plan.cur;
  let tcol='#fff',ttxt='',curRem=null;
  if(cur&&S.mode==='countdown'){
    curRem=S.running?S.endAt-now:S.remMs;
    if(!S.overtime&&curRem<0) curRem=0;
    if(S.useWarnColors){ if(curRem<=S.redSec*1000)tcol=S.warnRed||'#ff4540'; else if(curRem<=S.yellowSec*1000)tcol=S.warnYellow||'#ffc23a'; }
    if(curRem<0)tcol=S.warnRed||'#ff4540';
    ttxt=fmtMs(curRem);
  }
  setText($('nowTimer'),ttxt);
  if($('nowTimer').style.color!==tcol)$('nowTimer').style.color=tcol;
  const timerDisplay=ttxt?'block':'none'; if($('nowTimer').style.display!==timerDisplay)$('nowTimer').style.display=timerDisplay;

  const f=$('foot');
  if(plan.plannedEnd!=null){
    let projectedEnd=null,delta=null,ouHtml='';
    if(plan.ci>=0&&curRem!=null){ projectedEnd=now+Math.max(0,curRem)+plan.sumAfter; delta=projectedEnd-plan.plannedEnd; }
    if(delta!=null){ const sec=Math.round(delta/1000);
      if(Math.abs(sec)<=5)ouHtml=`<span class="ou ontime">${tr('onTime')}</span>`;
      else if(sec>0)ouHtml=`<span class="ou late">▲ ${fmtSecs(sec,false)} ${tr('behind')}</span>`;
      else ouHtml=`<span class="ou early">▼ ${fmtSecs(-sec,false)} ${tr('ahead')}</span>`;
    }
    setHTML(f,`<span>${tr('plannedEnd')}: <b>${clk(plan.plannedEnd)}</b></span>`+
      (projectedEnd!=null?`<span>${tr('projected')}: <b>${clk(projectedEnd)}</b></span>`:'')+ouHtml);
  } else setHTML(f,'');
}
renderTick();
setInterval(renderTick,100);
</script>
</body>
</html>
