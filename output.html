<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'">
<title>ProTimer — Ekran</title>
<link rel="stylesheet" href="fonts/digits.css">
<style>
  *{box-sizing:border-box; user-select:none; margin:0;}
  html,body{height:100%; overflow:hidden;
    font-family:-apple-system, "Helvetica Neue", system-ui, sans-serif;}
  body{background:#000; transition:background .15s;}
  body.idle,body.routed{cursor:none;}
  body.routed{transition:none;}
  body.key-output #stage.dual #secondaryPane{box-shadow:none;}

  #stage{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;}
  #stage{align-items:stretch;}
  .timer-pane{position:relative; flex:1 1 0; min-width:0; min-height:0; overflow:hidden;}
  .timer-content{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; transform-origin:center;}
  #secondaryPane{display:none;}
  #stage.dual.columns{flex-direction:row;}
  #stage.dual #secondaryPane{display:block;}
  #stage.dual.columns #secondaryPane{box-shadow:inset 1px 0 0 rgba(128,128,128,.25);}
  #stage.dual.rows #secondaryPane{box-shadow:inset 0 1px 0 rgba(128,128,128,.25);}
  #secondaryTimer{font-family:"SF Mono",ui-monospace,Menlo,monospace; font-weight:700; font-variant-numeric:tabular-nums; line-height:.95; white-space:nowrap;}
  #secondaryTimer.blink{animation:pulse 1s steps(2,start) infinite;}

  /* gornji tekst (labela / naziv koji korisnik ubaci) */
  #text{font-weight:600; line-height:1.1; text-align:center; padding:0 5vw;
    white-space:pre-wrap; word-break:break-word; display:none;}

  /* glavni tajmer */
  #timer{font-family:"SF Mono", ui-monospace, Menlo, monospace; font-weight:700;
    font-variant-numeric:tabular-nums; line-height:.95; white-space:nowrap;}

  /* donja poruka (alert) */
  #msg{position:absolute; bottom:7vh; left:0; right:0; text-align:center;
    font-size:6vh; font-weight:700; padding:0 5vw; line-height:1.15;
    white-space:pre-wrap; display:none;}
  #msg.flash{animation:pulse .8s steps(2,start) infinite;}
  #timer.blink{animation:pulse 1s steps(2,start) infinite;}
  @keyframes pulse{50%{opacity:.25;}}

  /* tanka traka napretka (opciono) */
  #prog{position:absolute; bottom:0; left:0; height:1vh; width:100%; display:none;}

  /* NOW / NEXT traka */
  #nownext{position:absolute; left:0; right:0; bottom:0; display:none; flex-direction:column;
    font-family:-apple-system, system-ui, sans-serif;}
  #nownext .nn{display:flex; justify-content:space-between; align-items:baseline; gap:3vw;
    padding:1.3vh 3.5vw; border-top:1px solid rgba(255,255,255,.13);}
  #nownext .nn .ttl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
  #nownext .nn .tag{flex:0 0 auto; font-size:1.9vh; letter-spacing:.18em; opacity:.55; font-weight:700;}
  #nownext .now .ttl{font-size:4vh;}
  #nownext .next{opacity:.62;} #nownext .next .ttl{font-size:3vh;}

  /* The free layout has one clipping boundary: the output window. Pane
     containers stop creating boxes; every foreground anchor uses the stage. */
  .free-audience #stage{display:block;}
  .free-audience #stage .timer-pane,
  .free-audience #stage .timer-content,
  .free-audience #stage.dual #secondaryPane{display:contents;}
  .free-audience #stage:not(.dual) #secondaryPane{display:none;}
  .free-audience #timer,.free-audience #secondaryTimer,.free-audience #text,
  .free-audience #msg,.free-audience #nownext,.free-audience #prog{position:absolute; right:auto; bottom:auto;}
  .free-audience #text,.free-audience #msg{width:max-content; max-width:90vw; padding:0; margin:0!important; overflow-wrap:anywhere;}
  .free-audience #nownext{width:80vw;}
  .free-audience #prog{height:1vh;}

  #blackout{position:absolute; inset:0; background:#000; z-index:80; display:none;}
  body.foreground-hidden #stage,body.foreground-hidden #stage *,
  body.foreground-hidden #msg,body.foreground-hidden #nownext,
  body.foreground-hidden #prog,body.foreground-hidden #audienceQr{visibility:hidden!important;}
  #audienceQr{position:absolute; inset:0; z-index:70; display:none; align-items:center; justify-content:center;
    padding:4vh 4vw; background:#000; color:#0b0d11; font-family:-apple-system,"Helvetica Neue",system-ui,sans-serif;}
  .audience-qr-card{width:min(76vw,760px); max-height:92vh; padding:clamp(18px,3.2vh,38px);
    display:flex; flex-direction:column; align-items:center; gap:clamp(8px,1.6vh,18px);
    background:#fff; border-radius:clamp(14px,2.2vh,28px); text-align:center; overflow:hidden;}
  #audienceQrLabel{font-size:clamp(24px,4.6vh,54px); line-height:1.08; font-weight:800;}
  #audienceQrSvg{width:min(52vw,52vh,520px); height:min(52vw,52vh,520px); flex:0 1 auto;}
  #audienceQrSvg svg{display:block; width:100%; height:100%;}
  #audienceQrHint{font-size:clamp(15px,2.4vh,27px); line-height:1.2; font-weight:600; color:#34343a;}
  #audienceQrUrl{max-width:100%; font:500 clamp(10px,1.45vh,17px)/1.3 "SF Mono",ui-monospace,Menlo,monospace;
    color:#696970; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #connection{position:fixed; top:1.5vh; right:1.5vw; z-index:90; display:none;
    padding:.55em .8em; border-radius:.45em; color:#fff; background:rgba(180,35,35,.9);
    font:700 12px/1.1 -apple-system,system-ui,sans-serif; letter-spacing:.08em;}
  body.disconnected #connection{display:block;}

  /* frameless prozor — kad GRID nije aktivan, cela površina služi za prevlačenje mišem */
  body.windowed #stage,body.windowed #audienceQr{ -webkit-app-region:drag; }
</style>
</head>
<body>
  <div id="stage">
    <div class="timer-pane" id="primaryPane"><div class="timer-content" id="primaryContent">
    <div id="text"></div>
    <div id="timer">--:--</div>
    </div></div>
    <div class="timer-pane" id="secondaryPane"><div class="timer-content" id="secondaryContent"><div id="secondaryTimer">--:--</div></div></div>
  </div>
  <div id="msg"></div>
  <div id="nownext"></div>
  <div id="prog"></div>
  <div id="audienceQr">
    <div class="audience-qr-card">
      <div id="audienceQrLabel"></div>
      <div id="audienceQrSvg"></div>
      <div id="audienceQrHint"></div>
      <div id="audienceQrUrl"></div>
    </div>
  </div>
  <div id="blackout"></div>
  <div id="connection">RECONNECTING…</div>

<script src="timer-tools.js"></script>
<script>
const IS_ELECTRON = !!window.pt;
const api = window.pt || null;

const routedOutput=new URLSearchParams(location.search).get('routed')==='1';
document.body.classList.toggle('routed',routedOutput);
let S = null, lastKey = '', lastNowNextKey = '', lastStateVersion = -1, lastServerInstance = null;
let isFS = false, fitMode = false, lastFitH = 0;   // kompaktan prozor (prati tajmer)
if (IS_ELECTRON) api.onWinFs(v => { isFS = !!v; lastKey = ''; lastFitH = 0; });

const $ = id => document.getElementById(id);
const styleCache = new WeakMap();
function setStyle(el,key,value){
  let cache=styleCache.get(el); if(!cache){ cache={}; styleCache.set(el,cache); }
  value=String(value);
  if(cache[key]!==value){ cache[key]=value; el.style[key]=value; }
}
function setText(el,value){ value=String(value); if(el.textContent!==value) el.textContent=value; }
function setClass(el,value){ if(el.className!==value) el.className=value; }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtSecs(s, neg){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
  return (neg?'−':'') + (h>0 ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`);
}
function fmtMs(ms){ return ms>=0 ? fmtSecs(Math.ceil(ms/1000),false) : fmtSecs(Math.floor(-ms/1000),true); }

function applyState(s){
  if (!s || typeof s !== 'object') return false;
  if (typeof s._instance === 'string' && s._instance !== lastServerInstance){
    lastServerInstance = s._instance;
    lastStateVersion = -1;
  }
  const version = Number(s._version);
  if (Number.isFinite(version)){
    if (version <= lastStateVersion) return false;
    lastStateVersion = version;
  }
  if (!clockSynced && Number.isFinite(s._serverNow)) clockOffsetMs=s._serverNow-Date.now();
  S = TimerTools.audienceState(s);
  const family=TimerTools.digitFamily(S.digitFont);
  setStyle($('timer'),'fontFamily',family);
  setStyle($('secondaryTimer'),'fontFamily',family);
  $('connection').textContent = s.lang === 'en' ? 'RECONNECTING…' : 'PONOVNO POVEZIVANJE…';
  render(); // Apply BLACK/LIVE and layout changes immediately, not on the next background timer tick.
  return true;
}

let clockOffsetMs=0, clockSynced=IS_ELECTRON, clockSyncing=false;
const hostNow=()=>Date.now()+clockOffsetMs;
async function syncClock(samples=3){
  if(IS_ELECTRON||clockSyncing) return;
  clockSyncing=true;
  let best=null;
  try{
    for(let i=0;i<samples;i++){
      const started=Date.now();
      const aborter=new AbortController();
      const timeout=setTimeout(()=>aborter.abort(),location.protocol==='https:'?7000:3000);
      let data;
      try{
        const response=await fetch('/time',{cache:'no-store',signal:aborter.signal});
        if(!response.ok) throw new Error('time '+response.status);
        data=await response.json();
      }finally{ clearTimeout(timeout); }
      const received=Date.now(), rtt=received-started;
      if(Number.isFinite(data.now)&&(!best||rtt<best.rtt)) best={rtt,offset:data.now-(started+received)/2};
    }
    if(best){ clockOffsetMs=best.offset; clockSynced=true; }
  }catch(_){}
  clockSyncing=false;
}

// --- prijem stanja: Electron (IPC) ili browser/OBS (SSE) ---
if (IS_ELECTRON){
  api.onState(applyState);
  api.onAudienceQr(info=>{
    const overlay=$('audienceQr');
    if(!info||!info.svg){ overlay.style.display='none'; $('audienceQrSvg').innerHTML=''; return; }
    $('audienceQrSvg').innerHTML=info.svg;
    $('audienceQrLabel').textContent=info.label||'';
    $('audienceQrHint').textContent=info.hint||'';
    $('audienceQrUrl').textContent=info.url||'';
    overlay.style.display='flex';
  });
} else {
  let disconnectTimer=null, lastPollSuccess=0, pollController=null;
  const connected=()=>{ clearTimeout(disconnectTimer); disconnectTimer=null; document.body.classList.remove('disconnected'); };
  const disconnectedSoon=()=>{ if(!disconnectTimer) disconnectTimer=setTimeout(()=>{
    disconnectTimer=null;
    if(location.protocol!=='https:'||Date.now()-lastPollSuccess>25000) document.body.classList.add('disconnected');
  },2500); };
  const connect = () => {
    const es = new EventSource('/events');
    es.onopen = () => { connected(); syncClock(1); };
    es.onmessage = e => { try { applyState(JSON.parse(e.data)); } catch(_){} };
    es.onerror = () => { disconnectedSoon(); es.close(); setTimeout(connect, 1000); };
  };
  const pollLoop = async () => {
    let failures=0;
    while(true){
      const aborter=new AbortController();
      pollController=aborter;
      const timeout=setTimeout(()=>aborter.abort(),30000);
      try{
        const response=await fetch('/poll?since='+encodeURIComponent(lastStateVersion)+'&r='+Date.now(),{cache:'no-store',signal:aborter.signal});
        if(!response.ok) throw new Error('poll '+response.status);
        const payload=await response.json();
        if(payload.state) applyState(payload.state);
        if(Number.isFinite(payload.version)&&payload.version>lastStateVersion) lastStateVersion=payload.version;
        failures=0;
        lastPollSuccess=Date.now(); connected();
      }catch(_){
        disconnectedSoon();
        failures=Math.min(failures+1,5);
        await new Promise(resolve=>setTimeout(resolve,Math.min(5000,500*(2**(failures-1)))+Math.random()*250));
      }finally{ clearTimeout(timeout); if(pollController===aborter) pollController=null; }
    }
  };
  disconnectedSoon();
  if(location.protocol==='https:') pollLoop(); else connect();
  syncClock(location.protocol==='https:'?1:3);
  setInterval(()=>syncClock(1),30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ if(pollController)pollController.abort(); syncClock(); } });
  window.addEventListener('online',()=>{ if(pollController)pollController.abort(); syncClock(); });
}

function render(){
  const now = hostNow();
  const d = new Date(now);

  // dok ne stigne stanje — prikaži tačno vreme
  if (!S&&routedOutput) return;
  if (!S){ paint(`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`, '#ffffff', '#000000', false, false, '', '', false, null); return; }

  const bg = S.transparent ? 'transparent' : (S.bgColor || '#000000');
  document.body.classList.toggle('overlay', !!S.transparent);
  document.body.classList.toggle('key-output',!!S.outputKeyColor);
  let fg = S.fgColor || '#ffffff';
  let text, neg = false, blink = false, prog = null;

  if (S.mode === 'clock'){
    text = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  } else if (S.mode === 'countup'){
    const el = S.running ? S.elapsedMs + (now - S.startAt) : S.elapsedMs;
    text = fmtSecs(Math.floor(el/1000), false);
  } else {
    let rem = S.running ? S.endAt - now : S.remMs;
    if (!S.overtime && rem < 0) rem = 0;
    if (S.useWarnColors){
      if (rem <= S.redSec*1000) fg = S.warnRed || '#ff4540';
      else if (rem <= S.yellowSec*1000) fg = S.warnYellow || '#ffc23a';
    }
    if (rem <= 0){ fg = S.warnRed || '#ff4540'; neg = rem < 0; blink = S.flashZero !== false; }
    prog = S.durationMs > 0 ? Math.max(0, Math.min(1, rem / S.durationMs)) : 0;
    text = fmtMs(rem);
  }

  if(S.outputKeyColor) fg='#ffffff';

  // kompaktan prozor: kad NIJE fullscreen i opcija je uključena → tajmer puni širinu, prozor prati visinu
  // tajmer UVEK puni prozor; grid se realizuje veličinom/pozicijom samog PROZORA (main proces)
  { const st=$('stage'); if(st.style.left){ st.style.inset='0'; st.style.left=st.style.top=st.style.width=st.style.height=''; } }
  // fit (kompaktan prozor) — samo ako NIJE grid i NIJE fullscreen
  const free = TimerTools.hasFreeLayout(S);
  fitMode = IS_ELECTRON && !!S.fitWindow && !isFS && !S.gridOn && !S.dualTimer && !free;
  document.body.classList.toggle('free-audience',free);
  document.body.classList.toggle('windowed',IS_ELECTRON&&!routedOutput&&!isFS&&!S.gridOn);
  setStyle($('stage'),'visibility',S.liveHidden?'hidden':'visible');
  setClass($('stage'),S.dualTimer?'dual '+(S.dualSplit==='rows'?'rows':'columns'):'');

  paint(text, fg, bg, neg, blink, S.text || '', S.message ? S.message.text : '',
        S.message && S.message.flash, S.showProgress ? prog : null,free);
  applyLayout($('primaryContent'),S.outputLayout);
  if(S.dualTimer&&S.secondary) renderSecondary(now,free);

  if (fitMode) requestFit();
  renderNowNext(fg,free);
  renderFreeLayout(free);
  document.body.classList.toggle('foreground-hidden',!!S.blackout&&S.blackoutMode==='foreground');
  setStyle($('blackout'),'display',S.blackout&&S.blackoutMode!=='foreground'?'block':'none');
}

function applyLayout(element,value){
  const layout=TimerTools.layout(value);
  setStyle(element,'transform',`translate(${layout.x}%, ${layout.y}%) scale(${layout.scale/100})`);
}
const freeNodes = {primary:'timer',secondary:'secondaryTimer',title:'text',message:'msg',rundown:'nownext',progress:'prog'};
let appliedFreeLayout, lastFreeState;
function renderFreeLayout(enabled){
  if(S===lastFreeState) return;
  lastFreeState=S;
  const values=enabled ? TimerTools.freeLayout(S.freeLayout,S.dualTimer,S.dualSplit) : null;
  const key=values ? JSON.stringify(values) : '';
  if(key===appliedFreeLayout) return;
  appliedFreeLayout=key;
  for(const [element,id] of Object.entries(freeNodes)){
    const el=$(id), pos=values?.[element];
    setStyle(el,'left',pos?(pos.x+100)/2+'%':'');
    setStyle(el,'top',pos?(pos.y+100)/2+'%':'');
    setStyle(el,'transform',pos?`translate(-50%, -50%) scale(${pos.scale/100})`:'');
  }
}
function renderSecondary(now,free){
  const timer=S.secondary, pane=$('secondaryPane'), el=$('secondaryTimer');
  let rem=TimerTools.remaining(timer,now); if(!(timer.overtime??S.overtime)) rem=Math.max(0,rem);
  const mode=timer.mode||'countdown',text=mode==='clock'?new Date(now).toLocaleTimeString('en-GB',{hour12:false}):mode==='countup'?fmtSecs(Math.floor(TimerTools.elapsed(timer,now)/1000),false):fmtMs(rem);
  const fg=S.outputKeyColor?'#ffffff':mode!=='countdown'?S.fgColor:rem<=0?(S.warnRed||'#ff4540'):S.useWarnColors?(rem<=S.redSec*1000?S.warnRed:rem<=S.yellowSec*1000?S.warnYellow:S.fgColor):S.fgColor;
  const neg=mode==='countdown'&&rem<0, blink=mode==='countdown'&&rem<=0&&(timer.flashZero??S.flashZero??true);
  setText(el,text); setStyle(el,'color',fg); setClass(el,[neg?'neg':'',blink?'blink':''].filter(Boolean).join(' '));
  setStyle(el,'fontSize',free?freeDigits(text):Math.min(pane.clientWidth*0.92/(TimerTools.digitWidth(S.digitFont,text)),pane.clientHeight*0.7)+'px');
  applyLayout($('secondaryContent'),timer.layout);
}

// kompaktan prozor: traži od main-a da visina prozora bude tačno koliko i tajmer (+mali rub)
function requestFit(){
  const tEl=$('timer'), txtEl=$('text');
  if (tEl.style.display==='none') return;
  let h = tEl.getBoundingClientRect().height;
  if (txtEl.style.display!=='none') h += txtEl.getBoundingClientRect().height + h*0.06;
  const want = Math.round(h * 1.34);
  if (h > 4 && Math.abs(want - lastFitH) > 4){ lastFitH = want; api.fitWindow(want); }
}

function renderNowNext(fg,free){
  const el = $('nownext');
  const cues = S.cues || [];
  if (!S.showNowNext || S.currentCue == null || S.currentCue < 0 || !cues.length){
    lastNowNextKey='hidden'; setStyle(el,'display','none'); setStyle($('msg'),'bottom','');
    return;
  }
  const cur = cues[S.currentCue], nxt = cues[S.currentCue + 1];
  const NOW = S.lang === 'en' ? 'NOW' : 'SADA', NEXT = S.lang === 'en' ? 'NEXT' : 'SLEDI';
  const key=[S.lang,S.currentCue,cur&&cur.name,nxt&&nxt.name].join('|');
  if(key!==lastNowNextKey){
    lastNowNextKey=key;
    let html = `<div class="nn now"><span class="ttl"></span><span class="tag">${NOW}</span></div>`;
    if (nxt) html += `<div class="nn next"><span class="ttl"></span><span class="tag">${NEXT}</span></div>`;
    el.innerHTML = html;
    setText(el.querySelector('.now .ttl'),cur?cur.name:'');
    if(nxt) setText(el.querySelector('.next .ttl'),nxt.name);
  }
  setStyle(el,'color',fg);
  setStyle(el,'bottom',free?'':S.showProgress?'1vh':'0');
  setStyle(el,'display','flex');
  setStyle($('msg'),'bottom',free?'':nxt?'17vh':'12vh');
}

function freeDigits(text){ return Math.min(innerWidth*.43/(TimerTools.digitWidth(S?.digitFont,text)),innerHeight*.34)+'px'; }
function paint(timeText, fg, bg, neg, blink, bigText, msgText, msgFlash, prog,free=false){
  setStyle(document.body,'background',bg);

  const tEl = $('timer'), txtEl = $('text'), st = free ? $('stage') : $('primaryPane');
  // veličina referentne oblasti = #stage (ceo ekran, ili kockica grida)
  const sw = st.clientWidth || innerWidth, sh = st.clientHeight || innerHeight;
  const textOnly = S && S.textOnly && bigText;

  // tekst (labela ili samostalno)
  if (bigText){
    setStyle(txtEl,'display','block');
    setText(txtEl,bigText);
    setStyle(txtEl,'color',fg);
    setStyle(txtEl,'fontSize',textOnly
      ? Math.min(sw*0.9/Math.max(6, bigText.length*0.55), sh*0.5) + 'px'
      : Math.min(sh*0.12, sw*0.06) + 'px');
    setStyle(txtEl,'marginBottom',textOnly?'0':(sh*0.02)+'px');
  } else {
    setStyle(txtEl,'display','none');
  }

  // tajmer
  if (textOnly){
    setStyle(tEl,'display','none');
  } else {
    setStyle(tEl,'display','block');
    setText(tEl,timeText);
    setStyle(tEl,'color',fg);
    setClass(tEl,[neg?'neg':'',blink?'blink':''].filter(Boolean).join(' '));
    if (free){
      setStyle(tEl,'fontSize',freeDigits(timeText)); lastKey='';
    } else if (fitMode){
      // puni širinu prozora; rezervisana dužina (stabilna) da se prozor ne trza po cifri
      const width = Math.max(TimerTools.digitWidth(S?.digitFont,timeText),
        TimerTools.digitWidth(S?.digitFont,fmtMs(S?.durationMs||0)),
        TimerTools.digitWidth(S?.digitFont,'0:00'));
      setStyle(tEl,'fontSize',Math.max(14,sw*0.86/width)+'px');
    } else {
      const width = TimerTools.digitWidth(S?.digitFont,timeText);
      const key = width + '|' + Math.round(sw) + 'x' + Math.round(sh) + '|' + (bigText?1:0);
      if (key !== lastKey){
        lastKey = key;
        const avail = bigText ? sh*0.6 : sh*0.7;
        setStyle(tEl,'fontSize',Math.min(sw*0.92/width,avail)+'px');
      }
    }
  }

  // poruka
  const mEl = $('msg');
  if (msgText){ setStyle(mEl,'display','block'); setText(mEl,msgText); setStyle(mEl,'color',fg); setClass(mEl,msgFlash?'flash':''); }
  else setStyle(mEl,'display','none');

  // traka napretka
  const pEl = $('prog');
  setStyle(pEl,'clipPath',free&&prog!==null?`inset(0 ${(1-prog)*100}% 0 0)`:'');
  if (prog !== null){ setStyle(pEl,'display','block'); setStyle(pEl,'width',free?'65%':(prog*100)+'%'); setStyle(pEl,'background',fg); }
  else setStyle(pEl,'display','none');
}

// ---------- Electron-only: čist ekran, BEZ vidljivih kontrola (sve je u Kontroli) ----------
if (IS_ELECTRON){
  let idleT=null;
  const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT);
    idleT=setTimeout(()=>document.body.classList.add('idle'),2000); };
  document.addEventListener('mousemove', wake); wake();
}

window.addEventListener('resize', () => { lastKey=''; });
render();
setInterval(render,50);
</script>
</body>
</html>
