<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=1270, initial-scale=1">
<title>ProTimer Product Hunt every screen</title>
<link rel="stylesheet" href="product-hunt.css">
</head>
<body>
  <main class="canvas" aria-label="ProTimer stage and backstage views for Product Hunt">
    <div class="content">
      <div class="topline">
        <div class="brand"><img src="../icon.png" alt="">PRO<span class="green">TIMER</span></div>
        <span class="badge">One timer · every screen</span>
      </div>
      <h1 class="slide-title">A clean countdown for the room. A live rundown for the crew.</h1>
      <div class="screens-layout">
        <section class="visual-card stage"><span class="label">Stage · projector · OBS</span><div class="screen"><img src="../screenshot-output.png" alt=""></div></section>
        <section class="visual-card crew"><span class="label">Backstage · phone · green room</span><div class="screen"><img src="../screenshot-backstage.png" alt=""></div></section>
      </div>
      <div class="screens-footer">
        <div class="pills"><span class="pill primary">VIEW-ONLY QR</span><span class="pill">NOW / NEXT</span><span class="pill">HOST-CLOCK SYNC</span></div>
        <span class="url">srdjankotarlic.github.io/protimer/</span>
      </div>
    </div>
  </main>
</body>
</html>
