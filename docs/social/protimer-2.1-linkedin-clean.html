<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>ProTimer 2.1 LinkedIn update</title>
<style>
  *{box-sizing:border-box}
  html,body{width:1200px;height:627px;margin:0;overflow:hidden;background:#070b0e}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#f5f7f8}
  .canvas{position:relative;width:1200px;height:627px;overflow:hidden;background:#070b0e url("protimer-event-background.png") center/cover no-repeat}
  .canvas::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,8,10,.28),rgba(4,8,10,.76) 58%,rgba(4,8,10,.28));pointer-events:none}
  .content{position:relative;z-index:1;display:grid;grid-template-columns:650px 1fr;gap:58px;width:100%;height:100%;padding:52px 58px 46px}
  .left{display:flex;flex-direction:column;min-width:0}
  .brand{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:850;letter-spacing:5px}
  .brand img{width:48px;height:48px;border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .brand .green{color:#45d368}
  .badge{align-self:flex-start;margin-top:43px;padding:8px 13px;border:1px solid rgba(69,211,104,.6);border-radius:999px;background:rgba(22,103,48,.26);color:#8eefa6;font-size:15px;font-weight:800;letter-spacing:1.6px}
  h1{margin:15px 0 0;font-size:68px;line-height:.98;letter-spacing:-2.5px}
  .sub{margin:14px 0 0;color:#c8d1d7;font-size:28px;font-weight:630;letter-spacing:-.5px}
  .updates{display:grid;gap:10px;margin:27px 0 0;padding:0;list-style:none;color:#ecf2f4;font-size:20px;font-weight:560}
  .updates li{display:flex;align-items:center;gap:12px}
  .updates li::before{content:"";width:8px;height:8px;border-radius:50%;background:#45d368;box-shadow:0 0 14px rgba(69,211,104,.85);flex:none}
  .footer{display:flex;align-items:end;gap:18px;margin-top:auto}
  .free{padding:9px 13px;border-radius:9px;background:#1b6331;color:#d8ffe2;font-size:15px;font-weight:800;letter-spacing:.6px;white-space:nowrap}
  .url{padding-bottom:7px;color:#aeb9bf;font-size:16px;font-weight:650;white-space:nowrap}
  .visual{display:flex;align-items:center;justify-content:center}
  .screen{position:relative;width:410px;border:1px solid rgba(255,255,255,.15);border-radius:23px;overflow:hidden;background:#000;box-shadow:0 34px 85px rgba(0,0,0,.58)}
  .screen img{display:block;width:100%;height:auto}
  .screen::before{content:"PRIKAZ ZA PUBLIKU";position:absolute;top:16px;left:18px;z-index:1;padding:6px 9px;border:1px solid rgba(255,255,255,.13);border-radius:7px;background:rgba(5,8,10,.7);color:#9da9af;font-size:10px;font-weight:800;letter-spacing:1.4px}
</style>
</head>
<body>
  <main class="canvas" aria-label="ProTimer 2.1 update for LinkedIn">
    <div class="content">
      <section class="left">
        <div class="brand"><img src="../icon.png" alt="">PRO<span class="green">TIMER</span></div>
        <div class="badge">NOVO AŽURIRANJE</div>
        <h1>ProTimer 2.1</h1>
        <p class="sub">Brži. Pregledniji. Stabilniji.</p>
        <ul class="updates">
          <li>Stabilniji prikaz na telefonu</li>
          <li>Jednostavniji unos vremena</li>
          <li>Pregledniji rundown sa skrolom</li>
        </ul>
        <div class="footer">
          <span class="free">BESPLATNO · macOS · Windows</span>
          <span class="url">srdjankotarlic.github.io/protimer/</span>
        </div>
      </section>
      <aside class="visual" aria-hidden="true">
        <div class="screen"><img src="../screenshot-output.png" alt=""></div>
      </aside>
    </div>
  </main>
</body>
</html>
