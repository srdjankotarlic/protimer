<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=1270, initial-scale=1">
<title>ProTimer Product Hunt control view</title>
<link rel="stylesheet" href="product-hunt.css">
</head>
<body>
  <main class="canvas" aria-label="ProTimer control workflow for Product Hunt">
    <div class="content">
      <div class="topline">
        <div class="brand"><img src="../icon.png" alt="">PRO<span class="green">TIMER</span></div>
        <span class="badge">One clear control window</span>
      </div>
      <h1 class="slide-title">Run the show without losing sight of the timer.</h1>
      <div class="control-layout">
        <section class="control-copy">
          <ul class="dot-list">
            <li>Large centred preview</li>
            <li>Fast duration entry</li>
            <li>Scrollable rundown</li>
            <li>START RUNDOWN + GO</li>
          </ul>
          <span class="url">ProTimer 2.1 · free &amp; open source</span>
        </section>
        <div class="screen" aria-hidden="true"><img src="../screenshot-control.png" alt=""></div>
      </div>
    </div>
  </main>
</body>
</html>
