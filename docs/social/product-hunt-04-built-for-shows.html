<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=1270, initial-scale=1">
<title>ProTimer Product Hunt built for shows</title>
<link rel="stylesheet" href="product-hunt.css">
</head>
<body>
  <main class="canvas" aria-label="ProTimer live production features for Product Hunt">
    <div class="content">
      <div class="topline">
        <div class="brand"><img src="../icon.png" alt="">PRO<span class="green">TIMER</span></div>
        <span class="badge">Built from real production needs</span>
      </div>
      <div class="benefits">
        <section class="benefit-copy">
          <h1>Everything a<br><span class="green">show needs.</span></h1>
          <ul class="dot-list">
            <li>Countdown, stopwatch &amp; clock</li>
            <li>Warning colors &amp; overtime</li>
            <li>Messages, blackout &amp; NOW/NEXT</li>
            <li>Phone, HTTP, OSC &amp; Companion</li>
          </ul>
          <div class="pills"><span class="pill primary">FREE</span><span class="pill">NO ACCOUNT</span><span class="pill">MIT LICENSE</span></div>
        </section>
        <div class="screen" aria-hidden="true"><img src="../screenshot-control.png" alt=""></div>
      </div>
    </div>
  </main>
</body>
</html>
