name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare cloudflared (macOS arm64)
        if: runner.os == 'macOS'
        run: node scripts/fetch-cloudflared.js mac
      - name: Prepare cloudflared (Windows x64)
        if: runner.os == 'Windows'
        run: node scripts/fetch-cloudflared.js win
      - name: Build verified installer
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        run: dist-installers/mac-arm64/ProTimer.app/Contents/MacOS/ProTimer --smoke --disable-gpu
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force (Join-Path (Get-Location).Drive.Root 'tmp') | Out-Null
          $process = Start-Process -FilePath ".\dist-installers\win-unpacked\ProTimer.exe" -ArgumentList "--smoke", "--disable-gpu" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows smoke test failed with exit code $($process.ExitCode)"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist-installers/*.dmg
            dist-installers/*.exe
          if-no-files-found: error
          retention-days: 2

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release set
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "release-assets/ProTimer-${version}-arm64.dmg"
          test -f "release-assets/ProTimer-Setup-${version}.exe"
          test -f "release-assets/ProTimer-${version}-portable.exe"
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          find release-assets -maxdepth 1 -type f -print
      - name: Create SHA-256 checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          (
            cd release-assets
            sha256sum \
              "ProTimer-${version}-arm64.dmg" \
              "ProTimer-Setup-${version}.exe" \
              "ProTimer-${version}-portable.exe" \
              > "ProTimer-${version}-SHA256SUMS.txt"
          )
      - name: Publish release atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mac="release-assets/ProTimer-${version}-arm64.dmg#macOS Apple Silicon — DMG"
          setup="release-assets/ProTimer-Setup-${version}.exe#Windows x64 installer — recommended"
          portable="release-assets/ProTimer-${version}-portable.exe#Windows x64 portable — no installation"
          checksums="release-assets/ProTimer-${version}-SHA256SUMS.txt#SHA-256 checksums"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            gh release upload "$tag" "$mac" "$setup" "$portable" "$checksums" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$mac" "$setup" "$portable" "$checksums" --draft --verify-tag \
              --title "ProTimer $tag" --notes-file "docs/RELEASE-NOTES-${version}.md" --repo "$GITHUB_REPOSITORY"
          fi
          gh release edit "$tag" --draft=false --latest --repo "$GITHUB_REPOSITORY"
