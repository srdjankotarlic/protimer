name: Chocolatey package

on:
  pull_request:
    branches: [main]
    paths:
      - packaging/chocolatey/**
      - .github/workflows/chocolatey.yml
      - scripts/check-packaging.js
      - package.json
      - docs/checksums/**
  push:
    branches: [main]
    paths:
      - packaging/chocolatey/**
      - .github/workflows/chocolatey.yml
      - scripts/check-packaging.js
      - package.json
      - docs/checksums/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chocolatey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, launch, upgrade and uninstall
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check manifest metadata and checksums
        run: npm run check:packaging
      - name: Pack Chocolatey package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'protimer-chocolatey'
          New-Item -ItemType Directory -Force $packageDir | Out-Null
          choco pack .\packaging\chocolatey\protimer.nuspec --outputdirectory $packageDir
          if ($LASTEXITCODE -ne 0) { throw "choco pack failed with exit code $LASTEXITCODE" }
          $package = Get-ChildItem $packageDir -Filter 'protimer.*.nupkg' | Select-Object -First 1
          if (-not $package) { throw 'Chocolatey did not create a ProTimer package' }
          "PACKAGE_DIR=$packageDir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          choco install protimer --version $version --source $env:PACKAGE_DIR -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey install failed with exit code $LASTEXITCODE" }
      - name: Verify installed portable application
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $toolsDir = Join-Path $env:ChocolateyInstall 'lib\protimer\tools'
          $appExe = Join-Path $toolsDir 'ProTimer.exe'
          $guiMarker = "$appExe.gui"
          $shim = Join-Path $env:ChocolateyInstall 'bin\ProTimer.exe'
          $desktopLink = Join-Path ([Environment]::GetFolderPath('Desktop')) 'ProTimer.lnk'
          $startMenuLink = Join-Path ([Environment]::GetFolderPath('Programs')) 'ProTimer.lnk'
          foreach ($path in @($appExe, $guiMarker, $shim, $desktopLink, $startMenuLink)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Expected ProTimer file is missing: $path" }
          }
          $checksumLine = Get-Content ".\docs\checksums\ProTimer-$version-SHA256SUMS.txt" |
            Where-Object { $_ -match "ProTimer-$([regex]::Escape($version))-portable\.exe$" } |
            Select-Object -First 1
          if (-not $checksumLine) { throw 'Portable checksum is missing from the release checksum file' }
          $expectedHash = ($checksumLine -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $appExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $expectedHash) { throw 'Installed portable executable hash does not match the release' }
          $shell = New-Object -ComObject WScript.Shell
          foreach ($shortcut in @($desktopLink, $startMenuLink)) {
            $target = [IO.Path]::GetFullPath($shell.CreateShortcut($shortcut).TargetPath)
            if (-not [StringComparer]::OrdinalIgnoreCase.Equals($target, $appExe)) {
              throw "ProTimer shortcut targets an unexpected executable: $shortcut -> $target"
            }
          }
          $smoke = Start-Process -FilePath $appExe -ArgumentList '--smoke' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed ProTimer smoke launch failed with exit code $($smoke.ExitCode)" }
          "PROTIMER_APP_EXE=$appExe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROTIMER_GUI_MARKER=$guiMarker" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROTIMER_SHIM=$shim" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROTIMER_DESKTOP_LINK=$desktopLink" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROTIMER_START_MENU_LINK=$startMenuLink" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "Installed and launched ProTimer portable $version"
      - name: Exercise upgrade path
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          choco upgrade protimer --version $version --source $env:PACKAGE_DIR -y --force --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey upgrade failed with exit code $LASTEXITCODE" }
      - name: Uninstall package
        shell: pwsh
        run: |
          choco uninstall protimer -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey uninstall failed with exit code $LASTEXITCODE" }
      - name: Verify application removal
        shell: pwsh
        run: |
          foreach ($path in @(
            $env:PROTIMER_APP_EXE,
            $env:PROTIMER_GUI_MARKER,
            $env:PROTIMER_SHIM,
            $env:PROTIMER_DESKTOP_LINK,
            $env:PROTIMER_START_MENU_LINK
          )) {
            if (Test-Path -LiteralPath $path) { throw "ProTimer payload, shim or shortcut remains after package removal: $path" }
          }
          if (Get-Process -Name 'ProTimer' -ErrorAction SilentlyContinue) {
            throw 'A ProTimer process remains after package removal'
          }
          Write-Output 'CHOCOLATEY_WINDOWS_OK'
      - name: Upload validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protimer-chocolatey-package
          path: ${{ env.PACKAGE_DIR }}/protimer.*.nupkg
          if-no-files-found: error
          retention-days: 14
